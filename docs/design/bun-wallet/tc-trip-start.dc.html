<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Start a trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3F9; color: #111014; font-family: 'Anuphan', 'DM Sans', sans-serif; line-height: 1.4; position: relative; overflow: hidden">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <button type="button" aria-label="กลับ" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #E9E7F1; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="#111014" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 14px; font-weight: 500; color: #6A4BD4">เริ่มทริป · ขั้นที่ 2 จาก 3</span>
      <span aria-hidden="true" style="display: flex; gap: 4px"><span style="width: 18px; height: 4px; border-radius: 2px; background: #6A4BD4"></span><span style="width: 18px; height: 4px; border-radius: 2px; background: #6A4BD4"></span><span style="width: 18px; height: 4px; border-radius: 2px; background: #DCD9E6"></span></span>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.4">ไปเที่ยวที่ไหน<br>และใช้สกุลอะไร?</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #6B6878">ระหว่างทริป ปุ่มจดจะเริ่มที่สกุลนี้ และติดป้ายทริปให้ทุกรายการ</p>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 2px">
      <div>
        <label for="tc-trip-name" style="display: block; font-size: 13px; line-height: 1.4; color: #4A4756; padding: 8px 14px 0; background: #E9E7F1; border-radius: 12px 12px 0 0">ชื่อทริป</label>
        <input id="tc-trip-name" type="text" value="ทริปญี่ปุ่น" style="width: 100%; box-sizing: border-box; height: 40px; border: none; border-radius: 0 0 12px 12px; background: #E9E7F1; padding: 0 14px 6px; font-family: inherit; font-size: 17px; font-weight: 700; color: #111014; outline: none">
      </div>

      <button type="button" aria-haspopup="dialog" aria-label="วันที่ 1 ถึง 8 พฤศจิกายน 2569 รวม 8 วัน แตะเพื่อเปลี่ยน" style="width: 100%; min-height: 64px; box-sizing: border-box; border: none; border-radius: 12px; background: #E9E7F1; padding: 8px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #111014; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 13px; line-height: 1.4; color: #4A4756">วันที่</span>
          <span style="font-size: 17px; font-weight: 700; line-height: 1.4">1–8 พ.ย. 2569</span>
        </span>
        <span style="font-size: 14px; color: #4A4756">8 วัน</span>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="#111014" stroke-width="2"></rect><path d="M4 9h16M9 3v4M15 3v4" stroke="#111014" stroke-width="2" stroke-linecap="round"></path></svg>
      </button>

      <button type="button" aria-haspopup="dialog" aria-label="สกุลเงินของทริป เยนญี่ปุ่น JPY แตะเพื่อเปลี่ยน" style="width: 100%; min-height: 64px; box-sizing: border-box; border: none; border-radius: 12px; background: #E9E7F1; padding: 8px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; color: #111014; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 13px; line-height: 1.4; color: #4A4756">สกุลเงินของทริป</span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; line-height: 1.4"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; font-size: 14px">¥</span><span style="font-family: 'DM Sans', sans-serif">JPY</span><span style="font-weight: 500">เยนญี่ปุ่น</span></span>
        </span>
        <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#111014" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>

      <div>
        <label for="tc-trip-budget" style="display: block; font-size: 13px; line-height: 1.4; color: #4A4756; padding: 8px 14px 0; background: #E9E7F1; border-radius: 12px 12px 0 0">งบทริป (ไม่ใส่ก็ได้)</label>
        <input id="tc-trip-budget" type="text" inputmode="numeric" value="¥120,000" style="width: 100%; box-sizing: border-box; height: 46px; border: none; border-bottom: 2px solid #111014; border-radius: 0 0 4px 4px; background: #E9E7F1; padding: 0 14px 6px; font-family: 'DM Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #111014; outline: none">
      </div>
    </div>

    <div aria-live="polite" style="display: flex; align-items: flex-start; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="10" fill="#6A4BD4"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 15px; line-height: 1.45"><span style="font-family: 'DM Sans', sans-serif; font-weight: 700">≈ ฿27,744.00</span> · วันละประมาณ <span style="font-family: 'DM Sans', sans-serif; font-weight: 700">¥15,000</span></span>
        <span style="font-size: 13px; line-height: 1.45; color: #6B6878">คิดจากเรทอ้างอิงล่าสุด <span style="font-family: 'DM Sans', sans-serif">1 ¥ = ฿0.2312</span></span>
      </span>
    </div>
  </div>

  <button type="button" aria-label="ถัดไป" style="position: absolute; right: 20px; bottom: 40px; width: 56px; height: 56px; border-radius: 50%; border: none; background: #111014; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 10px 24px rgba(17, 16, 20, 0.25)"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
