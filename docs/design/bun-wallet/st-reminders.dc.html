      <button type="button" aria-label="เวลาแจ้งเตือน 20:30 น. แตะเพื่อเปลี่ยน" style="height: 44px; padding: 0 12px; border-radius: 14px; border: 1px solid #E6E4EE; background: #F4F3F9; color: #111014; display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">

        20:30
        <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#6B6878" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>

    <div role="group" aria-labelledby="st-rem-days-label" style="padding: 12px 12px 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
        <span id="st-rem-days-label" style="font-size: 16px; line-height: 1.4">วัน</span>
        <span style="font-size: 14px; color: #6B6878; line-height: 1.4">ทุกวัน</span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 10px">
        <button type="button" aria-pressed="true" aria-label="วันจันทร์" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; padding: 0">จ</button>

        <button type="button" aria-pressed="true" aria-label="วันพฤหัสบดี" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; padding: 0">พฤ</button>
        <button type="button" aria-pressed="true" aria-label="วันศุกร์" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; padding: 0">ศ</button>
        <button type="button" aria-pressed="true" aria-label="วันเสาร์" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; padding: 0">ส</button>
        <button type="button" aria-pressed="true" aria-label="วันอาทิตย์" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; padding: 0">อา</button>

    <span>เตือนวันละครั้ง ถ้าวันนั้นยังไม่ได้จด</span>

  <button type="button" style="margin-top: auto; height: 56px; border-radius: 16px; border: none; background: #111014; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1.4; flex: none">บันทึก</button>
</div>
