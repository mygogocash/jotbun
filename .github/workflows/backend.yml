# Backend CI (P6b): the same commands as the local full gate
# (docs/implementation/handover.md, "Full gate"), plus the release image build
# and its smoke. It holds no secret, writes nothing (contents: read), pushes no
# image and deploys nothing. Every job runs on GitHub's ubuntu-24.04: the
# repository is public, so no job may run on a self-hosted runner (R127), and
# no repository variable can move one there.
#
# The jobs run in parallel, so a pull request waits for the slowest job rather
# than for all of them (ci-parallel-jobs, 9 November 2026). Every gate command
# runs once. The render suite is split five ways: two jobs run every render
# file but the two per-section suites, half of the files each (vitest
# --shard), and three jobs run those two suites by test name.
#
# ci-selective-jobs (14 November 2026; the owner asked for CI that is secure,
# fast and fits many pull requests at once): the first job, changes, reads the
# changed files and says which gate jobs the change needs
# (scripts/ci/changed-areas.mjs, run as the base commit has it). Each gate job
# runs only when its output says so; GitHub reports a skipped job as passed.
# - A pull request runs the jobs its change can affect.
# - A merge group (the merge queue), a push to main and a manual run always
#   run every job.
# - A push to the integration branch runs every job, unless it changed only
#   files no job reads (the controller's state). This is the full run after
#   each merge until the merge queue tests every merge.
# The ci-ok job is the one check to require: it fails when a job it needs
# failed or was cancelled, or when a full run skipped one.
#
# scripts/ci/backend-workflow.test.mjs (in test:ops) checks that every gate
# command runs, which job runs each step, that the render split runs every
# test exactly once, that the only `if:` lines are the change map's and
# ci-ok's, and that ci-ok needs every job.
name: backend

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, claude/p1a-vault-core]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Each push to a branch
# has a group of its own, so the controller's state sync right after a merge
# cannot cancel that merge's full run.
concurrency:
  group: backend-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # The release image's Node (apps/api/Dockerfile).
  NODE_VERSION: 26.9.0

jobs:
  # Which gate jobs this change needs, and the whitespace check, which every
  # change runs.
  changes:
    name: Changes (which jobs run) and whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.map.outputs.checks }}
      exports: ${{ steps.map.outputs.exports }}
      render: ${{ steps.map.outputs.render }}
      database: ${{ steps.map.outputs.database }}
      edge: ${{ steps.map.outputs.edge }}
      image: ${{ steps.map.outputs.image }}
      full: ${{ steps.map.outputs.full }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The change list and the whitespace check compare against the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The map as the base commit has it, so a pull request cannot change the
      # map its own run uses. When the base has none, or it fails, every job runs.
      - name: Which jobs this change needs (the base commit's change map)
        id: map
        run: git show "$MAP_BASE:scripts/ci/changed-areas.mjs" > "$RUNNER_TEMP/changed-areas.mjs" && node "$RUNNER_TEMP/changed-areas.mjs" || printf 'checks=true\nexports=true\nrender=true\ndatabase=true\nedge=true\nimage=true\nfull=true\n' >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          MAP_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before || 'HEAD' }}
      - name: Whitespace (the change under test)
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }} HEAD

  checks:
    name: Typecheck, unit, API, build
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only, no install scripts; the lockfile pins the Linux native bindings)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:app
      # The app with Expo Router's typed routes, so a broken link fails here.
      - run: npm run typecheck:routes -w gogospend-app
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run test:unit
      - run: npm run test:dev
      - run: npm run build -w gogospend-api
      - name: Release graph (no legacy code or unreviewed package reachable)
        run: node apps/api/scripts/release-graph.mjs check
      - name: Parser sandbox from the built files (both children, Node 26)
        run: node apps/api/scripts/parser-sandbox-check.cjs

  # The app's production bundles, as the stores and the web would get them:
  # the web export, and the iOS export (Hermes bytecode, compiled by the
  # Linux hermesc that the hermes-compiler package ships).
  exports:
    name: Exports (web and iOS bundles)
    needs: changes
    if: needs.changes.outputs.exports == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run export:web -w gogospend-app -- --max-workers 2
      - run: npm run export:ios -w gogospend-app -- --max-workers 2

  # The local gate's `npm run test:render -w gogospend-app`, split five ways.
  # These two jobs run every render file but the two per-section suites, which
  # render every catalogue section and take over half of the suite's time.
  # Vitest's --shard gives each job half of those files, every file once.
  render-1:
    name: Render (every file but the per-section suites, half 1 of 2)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:render -w gogospend-app -- --exclude src/dev/catalogue/CatalogueScreen.render.test.tsx --exclude src/dev/catalogue/screenReader.render.test.tsx --shard=1/2

  render-2:
    name: Render (every file but the per-section suites, half 2 of 2)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:render -w gogospend-app -- --exclude src/dev/catalogue/CatalogueScreen.render.test.tsx --exclude src/dev/catalogue/screenReader.render.test.tsx --shard=2/2

  # The two per-section suites, split by the length of the section id that
  # starts each test name ("section <id> ..."): a multiple of 3, one more than
  # a multiple of 3, and every other name (two more, and the catalogue's other
  # cases). The third pattern is the first two negated, so every test runs in
  # exactly one of these jobs.
  sections-1:
    name: Render, per-section suites (ids of length 3n)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:render -w gogospend-app -- src/dev/catalogue/CatalogueScreen.render.test.tsx src/dev/catalogue/screenReader.render.test.tsx -t '^section (?:[a-z0-9-]{3})+(?![a-z0-9-])'

  sections-2:
    name: Render, per-section suites (ids of length 3n+1)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:render -w gogospend-app -- src/dev/catalogue/CatalogueScreen.render.test.tsx src/dev/catalogue/screenReader.render.test.tsx -t '^section (?:[a-z0-9-]{3})*[a-z0-9-](?![a-z0-9-])'

  sections-3:
    name: Render, per-section suites (every other test)
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:render -w gogospend-app -- src/dev/catalogue/CatalogueScreen.render.test.tsx src/dev/catalogue/screenReader.render.test.tsx -t '^(?!section (?:[a-z0-9-]{3})+(?![a-z0-9-]))(?!section (?:[a-z0-9-]{3})*[a-z0-9-](?![a-z0-9-]))'

  database:
    name: SQL integration and ops (local PostgreSQL 17 container)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # test:db starts the loopback PostgreSQL 17 container itself
      # (scripts/dev-v1.mjs db-up, compose.postgres.yml, pinned digest).
      - run: npm run test:db
      # The ops suite (and P6a's local rehearsal) uses the same container; an
      # unreachable database fails the rehearsal instead of skipping it, as
      # in the local gate (scripts/ci/backend-workflow.test.mjs checks parity).
      - run: npm run test:ops
        env:
          GOGOSPEND_OPS_REQUIRE_DB: '1'

  # The edge Worker (apps/edge, its own lockfile): types, unit tests, the
  # UserVault suites in workerd and build, then its PostgreSQL suites,
  # including the differential run against the built NestJS v1 server and
  # the built Worker in workerd. test:edge:db starts its own container
  # (apps/edge's test:db runs scripts/dev-v1.mjs db-up first).
  edge:
    name: Edge Worker (types, unit, workerd, build, PostgreSQL container)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -w gogospend-api
      - run: npm run install:edge
      - run: npm run typecheck:edge
      - run: npm run test:edge
      - run: npm run test:edge:workers
      - run: npm run build:edge
      - run: npm run test:edge:db

  image:
    name: Release image and smoke (never pushed)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f apps/api/Dockerfile -t gogospend-ci .
      - name: Smoke (contracts load in every process; each fails closed; no legacy code)
        run: docker run --rm gogospend-ci node scripts/release-smoke.cjs

  # The one check to require (branch protection, the merge queue). It runs
  # even when a job it needs failed, and fails unless every job passed or the
  # change map skipped it; a full run (merge queue, main, a manual run, a
  # change that needs every job) may skip none.
  ci-ok:
    name: CI result (every needed job passed)
    needs: [changes, checks, exports, render-1, render-2, sections-1, sections-2, sections-3, database, edge, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Each job passed, or the change map skipped it
        run: echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' && echo "$NEEDS" | jq -e --arg full "$FULL" '[to_entries[] | select(.value.result != "success") | select(.key == "changes" or $full != "false" or .value.result != "skipped")] | length == 0'
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
